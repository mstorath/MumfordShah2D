[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "mumfordshah2d"
version = "0.5.2"
description = "Mumford-Shah edge-preserving image restoration — Python/Rust port of MATLAB/Java MumfordShah2D (Hohm, Storath & Weinmann)"
readme = "README_PYTHON.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = [
    "mumford-shah",
    "image-processing",
    "edge-preserving",
    "denoising",
    "deconvolution",
    "inpainting",
    "regularization",
    "variational-methods",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = ["numpy>=1.20", "scipy>=1.7"]
authors = [
    {name = "Kilian Hohm"},
    {name = "Martin Storath"},
    {name = "Andreas Weinmann"},
]

[project.urls]
Homepage = "https://github.com/mstorath/MumfordShah2D"
Repository = "https://github.com/mstorath/MumfordShah2D"
Changelog = "https://github.com/mstorath/MumfordShah2D/blob/master/CHANGELOG.md"
"Bug Tracker" = "https://github.com/mstorath/MumfordShah2D/issues"

[tool.maturin]
python-source = "."
module-name = "mumfordshah2d._core"
include = [{ path = "LICENSE", format = "wheel" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
